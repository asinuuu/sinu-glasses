# Step 1 test: build Meta's BirdSpotter sample, unchanged, on a cloud Mac.
# The output is an unsigned .ipa. It gets signed with Alan's free Apple ID
# on sinu (Sideloadly) and installed on the iPhone.
#
# Meta's code is cloned at build time, not copied into this repo.
name: Build BirdSpotter (unsigned)

on:
  workflow_dispatch:
    inputs:
      dat_ref:
        description: "Branch, tag or commit of meta/meta-wearables-dat-ios"
        default: "main"
        required: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PROJECT: dat/samples/BirdSpotter/BirdSpotter.xcodeproj
      # A bundle ID of our own, because Meta's is already taken on Apple's side.
      BUNDLE_ID: io.github.asinuuu.birdspotter
    steps:
      - name: Get Meta's sample
        run: |
          git clone --depth 1 --branch "${{ inputs.dat_ref }}" https://github.com/meta/meta-wearables-dat-ios.git dat \
            || { git clone https://github.com/meta/meta-wearables-dat-ios.git dat && git -C dat checkout "${{ inputs.dat_ref }}"; }
          echo "Meta commit: $(git -C dat rev-parse HEAD)"

      - name: Pick Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: List schemes
        run: xcodebuild -list -project "$PROJECT"

      - name: Build for iPhone, no signing
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme BirdSpotter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee xcodebuild.log | grep -E "error:|warning: .*MWDAT|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "App bundle: $APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          ls "$APP/Frameworks" || true
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry BirdSpotter-unsigned.ipa Payload
          ls -lh BirdSpotter-unsigned.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: BirdSpotter-unsigned
          path: BirdSpotter-unsigned.ipa
          # Short on purpose: the repo is public, and the .ipa contains Meta's SDK.
          retention-days: 1

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 3
